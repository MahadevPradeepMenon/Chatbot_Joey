name: Joey Docker CI

on:
  push:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "compose.production.yaml"
      - ".dockerignore"
      - ".env.production.example"
      - "requirements.txt"
      - "api/**"
      - "app/**"
      - "assets/**"
      - "rag/**"
      - "safety/**"
      - "storage/**"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "compose.production.yaml"
      - ".dockerignore"
      - ".env.production.example"
      - "requirements.txt"
      - "api/**"
      - "app/**"
      - "assets/**"
      - "rag/**"
      - "safety/**"
      - "storage/**"
      - ".github/workflows/docker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joey-docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Production image build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate local Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate production Docker Compose configuration
        run: >-
          docker compose
          --env-file .env.production.example
          -f compose.yaml
          -f compose.production.yaml
          config --quiet

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: chatbot-joey:ci
          cache-from: type=gha,scope=joey-production-image
          cache-to: type=gha,mode=max,scope=joey-production-image
          provenance: false
          sbom: false
