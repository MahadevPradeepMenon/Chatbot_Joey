name: Joey Container Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing semantic-version tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: joey-container-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  BUILDKIT_PROGRESS: plain

jobs:
  publish-container:
    name: Publish versioned production image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Resolve and validate release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${MANUAL_TAG}"
          else
            release_tag="${PUSH_TAG}"
          fi

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the form vMAJOR.MINOR.PATCH, for example v0.1.0." >&2
            exit 1
          fi

          commit_sha="$(git rev-parse HEAD)"
          image_name="${DOCKER_REGISTRY}/${GITHUB_REPOSITORY,,}"

          {
            echo "tag=${release_tag}"
            echo "version=${release_tag#v}"
            echo "commit=${commit_sha}"
            echo "short_sha=${commit_sha:0:12}"
            echo "image=${image_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
            ${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.short_sha }}
            ${{ steps.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=joey-production-image
          cache-to: type=gha,mode=max,scope=joey-production-image
          provenance: mode=max
          sbom: true
